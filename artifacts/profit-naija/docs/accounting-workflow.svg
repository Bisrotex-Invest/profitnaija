<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1040" role="img" aria-labelledby="workflow-title workflow-desc">
<title id="workflow-title">ProfitNaija accounting workflow</title>
<desc id="workflow-desc">Verified business access leads to purchases, sales, debt payments and expenses or returns. Business records feed inventory, profit, debt and tax or cash calculations, then dashboards, reports and invoices. Supporting services include backup and access management.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#668b77"/></marker></defs>
<rect width="1440" height="1040" fill="#f6f8f3"/>
<g font-family="Arial, sans-serif">
<text x="36" y="52" font-size="32" font-weight="700" fill="#0e462b">ProfitNaija · Accounting workflow</text>
<text x="36" y="82" font-size="17" font-weight="400" fill="#244636">From everyday business records to inventory, profit, balances, taxes and reports</text>
<rect x="36" y="110" width="1368" height="96" rx="16" fill="#e3eee6" stroke="#c7d9cf"/>
<text x="58" y="146" font-size="23" font-weight="700" fill="#244636">1 · Enter the right business workspace</text>
<text x="58" y="174" font-size="18" font-weight="400" fill="#244636">Verified account → profile and terms → trial / subscription access → owner’s business records</text>
<path d="M720,206 L720,238" fill="none" stroke="#668b77" stroke-width="2"/><path d="M195,238 L1245,238" fill="none" stroke="#668b77" stroke-width="2"/><path d="M195,238 L195,260" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/><path d="M545,238 L545,260" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/><path d="M895,238 L895,260" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/><path d="M1245,238 L1245,260" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="260" width="318" height="166" rx="16" fill="#ffffff" stroke="#c7d9cf"/><text x="56" y="294" font-size="21" font-weight="700" fill="#244636">2 · Purchases</text><text x="56" y="324" font-size="15" font-weight="400" fill="#244636">Base purchase + landed costs</text><text x="56" y="348" font-size="15" font-weight="400" fill="#244636">Add stock; record supplier balance</text><text x="56" y="372" font-size="15" font-weight="400" fill="#244636">Cash purchase: cash outflow</text><text x="56" y="396" font-size="15" font-weight="400" fill="#244636">Supplier VAT/WHT follow app rules</text>
<rect x="386" y="260" width="318" height="166" rx="16" fill="#ffffff" stroke="#c7d9cf"/><text x="406" y="294" font-size="21" font-weight="700" fill="#244636">2 · Sales &amp; invoices</text><text x="406" y="324" font-size="15" font-weight="400" fill="#244636">Quantity × VAT-exclusive unit price</text><text x="406" y="348" font-size="15" font-weight="400" fill="#244636">Add VAT once to invoice total</text><text x="406" y="372" font-size="15" font-weight="400" fill="#244636">Reduce stock at carrying cost</text><text x="406" y="396" font-size="15" font-weight="400" fill="#244636">Cash sale or customer credit</text>
<rect x="736" y="260" width="318" height="166" rx="16" fill="#ffffff" stroke="#c7d9cf"/><text x="756" y="294" font-size="21" font-weight="700" fill="#244636">2 · Debt payments</text><text x="756" y="324" font-size="15" font-weight="400" fill="#244636">Customer pays: debt ↓, cash ↑</text><text x="756" y="348" font-size="15" font-weight="400" fill="#244636">Supplier paid: debt ↓, cash ↓</text><text x="756" y="372" font-size="15" font-weight="400" fill="#244636">Link payment to original credit</text><text x="756" y="396" font-size="15" font-weight="400" fill="#244636">No second sale or purchase cost</text>
<rect x="1086" y="260" width="318" height="166" rx="16" fill="#ffffff" stroke="#c7d9cf"/><text x="1106" y="294" font-size="21" font-weight="700" fill="#244636">2 · Expenses &amp; returns</text><text x="1106" y="324" font-size="15" font-weight="400" fill="#244636">Expenses reduce business profit</text><text x="1106" y="348" font-size="15" font-weight="400" fill="#244636">Customer return: reverse sale/VAT</text><text x="1106" y="372" font-size="15" font-weight="400" fill="#244636">Supplier return: reduce stock/cost</text><text x="1106" y="396" font-size="15" font-weight="400" fill="#244636">Track supplier return expenses</text>
<path d="M195,426 L195,454" fill="none" stroke="#668b77" stroke-width="2"/><path d="M545,426 L545,454" fill="none" stroke="#668b77" stroke-width="2"/><path d="M895,426 L895,454" fill="none" stroke="#668b77" stroke-width="2"/><path d="M1245,426 L1245,454" fill="none" stroke="#668b77" stroke-width="2"/>
<path d="M195,454 L1245,454" fill="none" stroke="#668b77" stroke-width="2"/><path d="M720,454 L720,480" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="480" width="1368" height="88" rx="16" fill="#0e462b" stroke="#0e462b"/>
<text x="58" y="516" font-size="23" font-weight="700" fill="#ffffff">3 · Business records connect the operations</text>
<text x="58" y="545" font-size="17" font-weight="400" fill="#e5efe8">Entries + products + customer/supplier links, scoped to the account; linked credit changes use server validation.</text>
<path d="M720,568 L720,594" fill="none" stroke="#668b77" stroke-width="2"/><path d="M195,594 L1245,594" fill="none" stroke="#668b77" stroke-width="2"/><path d="M195,594 L195,616" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/><path d="M545,594 L545,616" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/><path d="M895,594 L895,616" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/><path d="M1245,594 L1245,616" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="616" width="318" height="166" rx="16" fill="#e3eee6" stroke="#c7d9cf"/><text x="56" y="650" font-size="21" font-weight="700" fill="#244636">4 · Inventory</text><text x="56" y="680" font-size="15" font-weight="400" fill="#244636">Available quantity and cost value</text><text x="56" y="704" font-size="15" font-weight="400" fill="#244636">Allocate remaining landed costs</text><text x="56" y="728" font-size="15" font-weight="400" fill="#244636">Sales remove goods at cost</text><text x="56" y="752" font-size="15" font-weight="400" fill="#244636">Closing stock at the chosen date</text>
<rect x="386" y="616" width="318" height="166" rx="16" fill="#e3eee6" stroke="#c7d9cf"/><text x="406" y="650" font-size="21" font-weight="700" fill="#244636">4 · Revenue &amp; profit</text><text x="406" y="680" font-size="15" font-weight="400" fill="#244636">Revenue = base sales − returns</text><text x="406" y="704" font-size="15" font-weight="400" fill="#244636">Cost = purchases − closing stock*</text><text x="406" y="728" font-size="15" font-weight="400" fill="#244636">Gross profit − expenses − interest</text><text x="406" y="752" font-size="15" font-weight="400" fill="#244636">Then estimate period PIT</text>
<rect x="736" y="616" width="318" height="166" rx="16" fill="#e3eee6" stroke="#c7d9cf"/><text x="756" y="650" font-size="21" font-weight="700" fill="#244636">4 · Customer/supplier debt</text><text x="756" y="680" font-size="15" font-weight="400" fill="#244636">Customer debt uses VAT-inclusive bill</text><text x="756" y="704" font-size="15" font-weight="400" fill="#244636">Payments reduce linked balances</text><text x="756" y="728" font-size="15" font-weight="400" fill="#244636">Supplier debt uses recorded bill</text><text x="756" y="752" font-size="15" font-weight="400" fill="#244636">Read balances as of period end</text>
<rect x="1086" y="616" width="318" height="166" rx="16" fill="#e3eee6" stroke="#c7d9cf"/><text x="1106" y="650" font-size="21" font-weight="700" fill="#244636">4 · Taxes &amp; cash</text><text x="1106" y="680" font-size="15" font-weight="400" fill="#244636">VAT / WHT / estimated PIT</text><text x="1106" y="704" font-size="15" font-weight="400" fill="#244636">Cash from recorded movements</text><text x="1106" y="728" font-size="15" font-weight="400" fill="#244636">Cash is different from profit</text><text x="1106" y="752" font-size="15" font-weight="400" fill="#244636">See report assumptions below</text>
<path d="M195,782 L195,812" fill="none" stroke="#668b77" stroke-width="2"/><path d="M545,782 L545,812" fill="none" stroke="#668b77" stroke-width="2"/><path d="M895,782 L895,812" fill="none" stroke="#668b77" stroke-width="2"/><path d="M1245,782 L1245,812" fill="none" stroke="#668b77" stroke-width="2"/>
<path d="M195,812 L1245,812" fill="none" stroke="#668b77" stroke-width="2"/><path d="M720,812 L720,836" fill="none" stroke="#668b77" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="836" width="1368" height="96" rx="16" fill="#ffffff" stroke="#c7d9cf"/>
<text x="58" y="873" font-size="23" font-weight="700" fill="#244636">5 · Dashboard, reports &amp; customer documents</text>
<text x="58" y="902" font-size="18" font-weight="400" fill="#244636">Profit &amp; loss · Cash flow · Debtors/creditors · VAT/WHT/PIT · Returns · Print/PDF/share · Invoices</text>
<rect x="36" y="956" width="1368" height="62" rx="16" fill="#fff4de" stroke="#dcc48f"/>
<text x="58" y="982" font-size="19" font-weight="700" fill="#244636">6 · Supporting services — not extra business sales</text>
<text x="58" y="1006" font-size="16" font-weight="400" fill="#244636">Backup/restore · Plan access · Admin/partner portals · Secure invoice sharing · Website/store discovery</text>
<text x="36" y="1033" font-size="14" font-weight="400" fill="#244636">* Current P&amp;L opening stock = 0. Cash flow assumes cash return settlements. Source-based guide, not an audit.</text>
</g></svg>